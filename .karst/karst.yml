id: invoice-reservation-068c99b8
host: 127.0.0.1
portRange:
  - 4000
  - 4100
baselineBranch: develop
worktreePathDisplay: relative
agentProvider: opencode
archiveDoneAfterDays: 3
repositories:
  service:
    repoPath: /Users/nd/Work/projects/invoice-reservation
    hasMigrations: true
    signals:
      - capacity
      - reservation
      - release
      - ledger
      - treasury
      - snapshot
      - program
      - invoice
      - kafka
      - postgres
      - migration
      - nestjs
      - api
      - endpoint
      - auth
      - fx
approaches:
  - id: rpi
    label: Research → Plan → Implement
    description: Scope unclear; API/contract undefined — discover before coding.
    entrypoint: research
    source:
      type: git
      repo: shanraisshan/claude-code-best-practice
      ref: main
      include:
        - development-workflows/rpi/.claude/agents
        - development-workflows/rpi/.claude/commands/rpi
    workflow:
      - name: describe
      - name: research
        command: /rpi:research
      - name: plan
        command: /rpi:plan
      - name: implement
        command: /rpi:implement
    enabled: true
  - id: gsd
    label: Get Shit Done
    description: >-
      Spec-driven phase loop; heavy research/plan/execute in fresh-context
      subagents.
    entrypoint: gsd-next
    source:
      type: git
      repo: open-gsd/gsd-core
      ref: main
      include:
        - skills/gsd-next
    enabled: true
  - id: superpowers:writing-plans
    label: Write a plan first
    description: Scope known but non-trivial — plan before executing.
    entrypoint: writing-plans
    source:
      type: git
      repo: obra/superpowers
      ref: main
      include:
        - skills/writing-plans
    workflow:
      - name: plan
      - name: implement
    enabled: true
  - id: superpowers:test-driven-development
    label: TDD
    description: Bug fix or feature with clear acceptance criteria — tests first.
    entrypoint: test-driven-development
    source:
      type: git
      repo: obra/superpowers
      ref: main
      include:
        - skills/test-driven-development
    enabled: true
  - id: single-subagent
    label: Direct implementation with a subagent
    description: Small, well-scoped change; delegate to one focused subagent.
    enabled: true
  - id: direct
    label: Direct implementation
    description: Small, fully-clear change; just implement.
    enabled: true
  - id: speckit
    label: Spec Kit
    description: >-
      Spec-driven: specify → clarify → plan → tasks → implement, each phase a
      durable artifact under specs/<feature>/.
    entrypoint: specify
    source:
      type: git
      repo: github/spec-kit
      ref: main
      include:
        - templates/commands
    workflow:
      - name: describe
      - name: specify
        command: /speckit:specify
      - name: clarify
        command: /speckit:clarify
      - name: plan
        command: /speckit:plan
      - name: tasks
        command: /speckit:tasks
      - name: implement
        command: /speckit:implement
    enabled: true
agents:
  research:
    role: research
    enabled: true
  plan:
    role: plan
    enabled: true
  implement-fe:
    role: implement
    enabled: true
  implement-be:
    role: implement
    enabled: true
  test:
    role: test
    enabled: true
  review:
    role: review
    enabled: true
uat:
  maxFixAttempts: 3
  stallTimeoutMinutes: 60
  env: {}
  secrets: []
  passthrough: []
  origins: []
  repositories:
    frontend:
      gates:
        - name: test
          kind: script
          script: test:unit
  gates:
    - name: test
      kind: script
      script: test
    - name: e2e
      kind: command
      command: npx
      args:
        - playwright
        - test
      repo: frontend
  testerVerifier:
    name: verify-uat
    kind: command
    command: ./scripts/verify-uat.sh
  testerObservations:
    blockingSeverity: high
ticketing:
  provider: manual
  advanceOnShip: false
  advanceOnStart: false
  searchEnabled: true
review:
  maxFixAttempts: 3
  stallTimeoutMinutes: 60
  requireIndependentSignal: true
  openChanges: false
  findings:
    enabled: true
    blockingSeverity: high
    maxFindings: 50
  repositories: {}
defaultModel: opencode-go/deepseek-v4.1-flash
resilience:
  retries: 2
  backoffMs: 2000
  fallbackModels: []
diffsInSourceControl: true
