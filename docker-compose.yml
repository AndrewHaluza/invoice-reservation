# Host ports are parameterised so several ticket worktrees can run this stack
# side by side. Karst allocates the ports and exports them (see
# scripts/dev-stack.sh); the defaults below are the baseline/manual values.
# Container-internal ports never change — only the published host port does.
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity_local_dev
      POSTGRES_DB: capacity
    ports:
      - "${PG_PORT:-5432}:5432"
    labels:
      # Read by `scripts/dev-stack.sh reap`: an absent worktree means this stack
      # is an orphan of a ticket karst SIGKILLed, and can be removed.
      karst.worktree: "${KARST_WORKTREE:-}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    labels:
      # Read by `scripts/dev-stack.sh reap`: an absent worktree means this stack
      # is an orphan of a ticket karst SIGKILLed, and can be removed.
      karst.worktree: "${KARST_WORKTREE:-}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      # INTERNAL is the container-namespace listener: its advertised address is
      # reachable from inside the netns, which is where redpanda-init runs. The
      # PLAINTEXT/SASL listeners advertise the HOST-side port, because their
      # clients live on the host and must reconnect to the published port.
      - --kafka-addr
      - INTERNAL://0.0.0.0:19092,PLAINTEXT://0.0.0.0:9092,SASL://0.0.0.0:9093
      - --advertise-kafka-addr
      - INTERNAL://localhost:19092,PLAINTEXT://localhost:${KAFKA_PORT:-9092},SASL://localhost:${KAFKA_SASL_PORT:-9093}
      - --set
      - redpanda.enable_sasl=true
      - --set
      - 'redpanda.superusers=["capacity"]'
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_SASL_PORT:-9093}:9093"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    labels:
      # Read by `scripts/dev-stack.sh reap`: an absent worktree means this stack
      # is an orphan of a ticket karst SIGKILLed, and can be removed.
      karst.worktree: "${KARST_WORKTREE:-}"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    network_mode: "service:redpanda"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk security user create capacity --password capacity_local_dev --mechanism SCRAM-SHA-512 || true
        rpk security user create treasury --password treasury_local_dev --mechanism SCRAM-SHA-512 || true
        rpk security user create ops --password ops_local_dev --mechanism SCRAM-SHA-512 || true
        RPK="rpk topic create -p 3 -r 1 -X brokers=localhost:19092 -X user=capacity -X pass=capacity_local_dev -X sasl.mechanism=SCRAM-SHA-512"
        $$RPK treasury.capacity.events || true
        $$RPK treasury.capacity.snapshots || true
        $$RPK treasury.capacity.dlq || true
        # Topic ACLs (research R11 / FR-034 / FR-036). Every command is tolerant
        # so an already-existing ACL cannot fail the init container. The local
        # `capacity` user is a superuser, so enforcement is nominal here; see
        # docs/kafka-acls.md.
        RPKACL="rpk acl create -X brokers=localhost:19092 -X user=capacity -X pass=capacity_local_dev -X sasl.mechanism=SCRAM-SHA-512"
        $$RPKACL --allow-principal User:treasury --operation write --topic treasury.capacity.events || true
        $$RPKACL --allow-principal User:treasury --operation write --topic treasury.capacity.snapshots || true
        $$RPKACL --allow-principal User:capacity --operation read,describe --topic treasury.capacity.events || true
        $$RPKACL --allow-principal User:capacity --operation read,describe --topic treasury.capacity.snapshots || true
        $$RPKACL --allow-principal User:capacity --operation read,describe --group capacity-treasury-consumer || true
        $$RPKACL --allow-principal User:capacity --operation write --topic treasury.capacity.dlq || true
        $$RPKACL --allow-principal User:ops --operation read,describe --topic treasury.capacity.dlq || true
        $$RPKACL --allow-principal User:ops --operation read,describe --group ops-replay || true

volumes:
  pgdata:
